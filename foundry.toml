[profile.default]
src = "foundry/src"
test = "foundry/test"
out = "foundry/out"
libs = ["node_modules", "foundry/lib"]
cache_path = "foundry/cache"
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
    "@openzeppelin/contracts/=foundry/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=foundry/lib/openzeppelin-contracts-upgradeable/contracts/"
]

# Base mainnet profile - use with --profile mainnet
# Set BASE_RPC_URL and BASESCAN_API_KEY in .env file

[etherscan.base]
key = "${BASESCAN_API_KEY}"
url = "https://api.basescan.org/api"
